<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>금거래소 매장관리 프로토타입</title>
<style>
:root{--bg:#f3f5f4;--sf:#fff;--tx:#17201d;--mu:#617069;--ln:#d9e0dc;--ac:#1f4d43;--ac2:#a67c1f;--wn:#b3382c;--ok:#2d7a4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121816;--sf:#1b2320;--tx:#e8eeeb;--mu:#93a39b;--ln:#2e3a35;--ac:#5fb59f;--ac2:#d4a63c;--wn:#ef7b6e;--ok:#6fcf97}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Pretendard","Noto Sans KR","Malgun Gothic",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;background:var(--ac);color:#fff;flex-wrap:wrap}
header b{font-size:17px}header small{opacity:.85}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:6px;padding:6px 12px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.d{color:var(--wn)}
header button{background:transparent;color:#fff;border-color:#ffffff88}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac2);outline-offset:1px}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--sf);border-bottom:1px solid var(--ln)}
nav button{border:0;background:none;white-space:nowrap;color:var(--mu)}
nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 -3px var(--ac2)}
main{max-width:1000px;margin:0 auto;padding:16px}
h2{margin:0 0 12px;font-size:19px}h3{margin:0 0 8px;font-size:16px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mu)}
input,select{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--tx)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:600}
tr.r{cursor:pointer}tr.r:hover{background:var(--bg)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 16px}
.kv div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--ln);padding:3px 0}.kv span{color:var(--mu)}
.price{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.price div{border:1px solid var(--ln);border-radius:8px;padding:10px}.price b{display:block;font-size:20px;color:var(--ac)}
.price small{color:var(--mu)}.mg{color:var(--ok);font-size:13px}.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:end}
.tag{font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--ac2);color:var(--ac2)}
#login{max-width:360px;margin:8vh auto;padding:0 16px}#login .card>*{margin-bottom:10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ac);color:#fff;padding:8px 16px;border-radius:20px;display:none}
.note{color:var(--mu);font-size:13px}
.fl{position:relative;overflow:hidden;display:inline-block;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:6px;padding:6px 12px;cursor:pointer}
.fl input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;padding:0;border:0}
.ph{padding:0 5px;border:0;background:none;font-size:16px;cursor:pointer;vertical-align:middle}
.c-x{opacity:.55}.c-g{background:rgba(45,160,90,.22)}.c-y{background:rgba(235,190,20,.30)}.c-r{background:rgba(215,55,45,.25)}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),W=3.75,fmt=n=>Math.round(n).toLocaleString('ko-KR'),g3=n=>(+n).toFixed(3);
const today=new Date().toISOString().slice(0,10);
let db,cur=null,tab='',sel=null,edit=-1,det=false;
const seed=()=>({
 stores:[{code:'000',name:'본사',biz:'-'},{code:'S01',name:'경주금거래소',biz:'123-45-67890'}],
 users:[{id:'admin',pw:'1234',name:'시스템관리자',tel:'010-0000-0000',grp:'A',exp:'2099-12-31',store:'000'},
  {id:'mgr',pw:'1234',name:'김점장',tel:'010-1111-2222',grp:'M',exp:'2099-12-31',store:'S01'},
  {id:'staff',pw:'1234',name:'이직원',tel:'010-3333-4444',grp:'U',exp:'2099-12-31',store:'S01'}],
 cats:[['R','반지'],['N','목걸이'],['P','펜던트'],['B','팔찌'],['E','귀걸이'],['I','피어싱'],['S','형상'],['X','기타']].map(c=>({code:c[0],name:c[1],store:'S01'})),
 vendors:[{code:'A01',name:'가나주얼리',tel:'02-111-2222',store:'S01'},{code:'B02',name:'다라금방',tel:'02-333-4444',store:'S01'}],
 rates:[{date:'2026-10-13',round:1,au:620000,ag:9000,pt:290000,store:'S01'},{date:'2026-10-14',round:1,au:628000,ag:9100,pt:288000,store:'S01'}],
 cfg:{S01:{disc:5,card:3}},
 products:[
  {code:'2610001',model:'GR-1021',cat:'R',vendor:'A01',date:'2026-10-05',mat:'24',color:'G',purity:'999',size:'12호',total:7.5,w24:7.5,w18:0,w14:0,labor:15000,stoneLabor:0,vat:1,qty:3,store:'S01'},
  {code:'2610002',model:'PT3562/DT',cat:'P',vendor:'A01',date:'2026-10-08',mat:'18',color:'W',purity:'750',size:'-',total:4.8,w24:0,w18:3.9,w14:0,labor:35000,stoneLabor:1800,vat:1,qty:2,store:'S01'},
  {code:'2610003',model:'GB-770',cat:'B',vendor:'B02',date:'2026-10-10',mat:'24',color:'G',purity:'999',size:'17.5+여유2cm',total:11.235,w24:11.235,w18:0,w14:0,labor:28000,stoneLabor:0,vat:1,qty:1,store:'S01'},
  {code:'2610004',model:'PN-205',cat:'N',vendor:'B02',date:'2026-10-11',mat:'14',color:'P',purity:'585',size:'45cm',total:3.2,w24:0,w18:0,w14:2.9,labor:22000,stoneLabor:1800,vat:1,qty:4,store:'S01'},
  {code:'2610005',model:'PTR-88',cat:'R',vendor:'A01',date:'2026-10-12',mat:'PT',color:'W',purity:'950',size:'14호',total:5.1,w24:5.1,w18:0,w14:0,labor:30000,stoneLabor:0,vat:1,qty:2,store:'S01'}],
 sales:[]});
try{db=JSON.parse(localStorage.getItem('goldproto1'))}catch(e){}
db=db||seed();
if(!db.mA){db.stores.filter(s=>s.code!='000').forEach(s=>{if(!db.cats.some(c=>c.store==s.code&&c.code=='A'))db.cats.push({code:'A',name:'공시가',store:s.code})});
 if(!db.products.some(p=>p.store=='S01'&&p.code=='2610006'))db.products.push({code:'2610006',model:'공시-GB10',cat:'A',vendor:'A01',date:'2026-10-14',mat:'24',color:'G',purity:'999',size:'-',total:3.75,w24:3.75,w18:0,w14:0,labor:10000,stoneLabor:0,vat:1,qty:5,store:'S01'});db.mA=1}
if(!db.mB){const sp=db.products.find(p=>p.code=='2610006');if(sp&&!sp.policy){sp.policy='P';sp.listPrice=450000}
 if(!db.products.some(p=>p.store=='S01'&&p.code=='2610007'))db.products.push({code:'2610007',model:'은팔지-S1',cat:'B',vendor:'B02',date:'2026-10-15',mat:'Ag',color:'W',purity:'925',size:'-',total:20,w24:20,w18:0,w14:0,labor:5000,stoneLabor:0,vat:1,qty:3,store:'S01',policy:'U',mult:2,costRate:8800,listPrice:0});db.mB=1}
if(!db.mC){const sp=db.products.find(p=>p.code=='2610006'&&p.store=='S01');if(sp&&sp.policy=='P'){sp.directCost=560000;delete sp.listPrice}db.mC=1}
if(!db.mD){const sp=db.products.find(p=>p.code=='2610007'&&p.store=='S01');if(sp&&sp.policy=='U'&&!sp.directCost)sp.directCost=52000;db.mD=1}
if(!db.users.some(u=>u.id=='sub'))db.users.push({id:'sub',pw:'1234',name:'박부점장',tel:'010-5555-6666',grp:'S',exp:'2099-12-31',store:'S01'});
db.holidays=db.holidays||[];db.orders=db.orders||[];db.carts=db.carts||{};db.vendors.forEach(v=>v.status=v.status||'활성');db.orders.forEach(o=>o.status=o.status=='취소'?'주문취소':(o.status||'주문'));db.sales.forEach((s,i)=>s.id=s.id||'s'+Date.now()+i);
const save=()=>{try{localStorage.setItem('goldproto1',JSON.stringify(db))}catch(e){toast('저장 공간이 부족합니다. 사진 수를 줄여 주세요')}};
function msg(t,h){const d=document.createElement('div');d.id='mdl';d.style.cssText='position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px';
 d.innerHTML=`<div class=card style="max-width:340px;width:100%;margin:0"><h3>${h||'입력 확인'}</h3><p>${t}</p><button class=p style="width:100%" onclick="this.closest('#mdl').remove()">확인</button></div>`;document.body.appendChild(d)}
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)};
const mine=k=>db[k].filter(x=>x.store==cur.store);
function rSort(a){return a.slice().sort((x,y)=>x.date==y.date?y.round-x.round:(x.date<y.date?1:-1))}
const moreBar=n=>n>rLim?`<p class=note>최근 ${rLim}건만 표시 (전체 ${n}건) <button onclick="rLim+=30;shell()">더 보기</button></p>`:`<p class=note>전체 ${n}건</p>`;
let RO=null,CO=null;const rateNow=()=>RO||rSort(mine('rates'))[0]||{au:0,ag:0,pt:0};
const cfgNow=()=>{if(CO)return CO;const c=db.cfg[cur.store]||(db.cfg[cur.store]={disc:5,card:3});if(c.discA==null){c.discA=3;c.cardA=c.card}return c};
// ---- 계산 ----
function calc(p){
 const r=rateNow(),conv=p.mat=='24'||p.mat=='PT'||p.mat=='Ag'?(+p.w24):(+p.w24)+p.w18*.825+p.w14*.6435;
 const perDon=p.mat=='PT'?r.pt:p.mat=='Ag'?r.ag:r.au;
 const stone=Math.max(0,p.total-p.w24-p.w18-p.w14),lab=+p.labor+ +p.stoneLabor;
 const vf=p.vat==0?1.1:1,tag=Math.ceil(lab*2.5*vf/100)*100,gold=perDon/W*conv,pol=p.policy||'S',cg=(+p.costRate>0?+p.costRate:perDon)/W*conv,cost=pol!='S'?(+p.directCost||0):cg+lab,c=cfgNow();
 const base=pol=='U'?cost*vf*(+p.mult||1):pol=='P'?(+PUB[p.store+p.code]||0):gold+tag,A=pol=='P',dp=A?c.discA:c.disc,cp=A?c.cardA:c.card;const R=n=>Math.round(n/1000)*1000,b=R(base);return{conv,stone,lab,tag,gold,cost,base:b,dp,cp,pol,cg,disc:R(pol=='P'?b*(1-dp/100):b/(1+dp/100)),card:R(b*(1+cp/100))};
}
const PUB={};const PN={S:'기준시세',U:'단가제',P:'공시가제'};
const ds=g=>g3(g)+'g / '+g3(g/W)+'돈';
// ---- 로그인 ----
function loginView(){
 $('#app').innerHTML=`<div id=login><div class=card><h2>금거래소 매장관리</h2>
 <label>매장번호<input id=ls value=S01></label><label>아이디<input id=li value=mgr></label>
 <label>비밀번호<input id=lp type=password value=1234></label><button class=p style="width:100%" onclick=doLogin()>로그인</button>
 <button style="width:100%" onclick="toast('등록된 전화번호로 임시 비밀번호가 발송됩니다(프로토타입)')">비밀번호 찾기</button>
 <p class=note>체험 계정(비밀번호 1234)<br>관리자: 000 / admin<br>매장 Manager: S01 / mgr<br>직원 User: S01 / staff<br>서브 관리자 S: S01 / sub</p></div></div>`;
}
function doLogin(){
 const s=$('#ls').value.trim(),u=db.users.find(x=>x.id==$('#li').value.trim()&&x.pw==$('#lp').value&&x.store==s);
 if(!u)return toast('매장번호·아이디·비밀번호를 확인하세요');
 if(u.exp<today)return toast('권한 만료일이 지났습니다');
 cur=u;tab=menus()[0][0];shell();
}
const GN={A:'시스템관리자',M:'매장 관리자',S:'서브 관리자',U:'직원'};
function menus(){const g=cur.grp,m=[];
 if(g=='A')return[['stores','매장 관리'],['users','관리자 ID'],['groups','사용자 그룹']];
 m.push(['look','제품 조회'],['cart','장바구니'+(cartN()?' ('+cartN()+')':'')],['sales','판매 현황'],['orders','주문 현황'],['rates','시세 조회']);
 if(g=='M'||g=='S'){m.push(['regp','제품 등록'],['vend','업체 등록'],['regr','시세 등록'],['cat','분류 등록'],['hol','휴무일 등록']);if(g=='M')m.push(['users','직원 ID'])}
 return m}
function shell(){
 const st=db.stores.find(s=>s.code==cur.store);
 $('#app').innerHTML=`<header><div><b>${st.name}</b> <small>${cur.name} · ${GN[cur.grp]}</small></div><button onclick="cur=null;loginView()">로그아웃</button></header>
 <nav>${menus().map(m=>`<button class="${m[0]==tab?'on':''}" onclick="go('${m[0]}')">${m[1]}</button>`).join('')}</nav><main id=main></main>`;
 ({look,cart:cartV,sales:salesV,orders:ordersV,hol:holV,rates:ratesView,regr,regp,vend,cat,users:usersV,stores:storesV,groups})[tab]();
}
const go=t=>{tab=t;sel=null;edit=-1;rLim=30;pPhKey=null;shell()};
// ---- 제품 조회 / 판매 ----
function look(){
 const M=cur.grp=='M'||cur.grp=='S',q=(window.lq||'').trim();
 const list=!lGo?[]:mine('products').filter(p=>(lAll||p.qty>0)&&(!q||p.code.includes(q)||p.model.toLowerCase().includes(q.toLowerCase())));
 const cn=c=>(db.cats.find(x=>x.code==c&&x.store==cur.store)||{}).name||c,vn=c=>(db.vendors.find(x=>x.code==c&&x.store==cur.store)||{}).name||c;
 let h=`<h2>제품 조회</h2><div class=card><div class=row><div style="flex:1"><label>제품코드 / 모델명<input id=q value="${q}" onkeydown="if(event.key=='Enter')sq()"></label></div>
 <div><label style="display:flex;gap:6px;align-items:center;color:var(--tx);font-size:14px"><input id=qa type=checkbox style="width:auto" ${lAll?'checked':''}>재고 없는 제품도 보기</label></div><button class=p onclick=sq()>조회</button><button onclick="toast('실제 앱에서는 카메라로 QR 코드를 스캔합니다');">QR 스캔</button></div>
 </div>
 <div class=card>${lGo?`<p class=note style="margin:0 0 8px">검색 결과 ${list.length}건${list.length>100?' (상위 100건만 표시, 조건을 더 좋혀 주세요)':''}</p>`:''}<div class=tw><table><tr><th>코드<th>모델<th>분류<th>재질<th>총중량<th>정상가<th>재고</tr>${list.slice(0,100).map(p=>{const c=calc(p);return`<tr class=r onclick="pick('${p.code}')"><td>${p.code}<td>${p.model} ${phIcon(p.code,p.store)}<td>${cn(p.cat)}<td>${p.mat}K/${p.purity}<td>${g3(p.total)}g<td>${c.pol=='P'&&!c.base?'공시가 입력':fmt(c.base)}<td>${p.qty}</tr>`}).join('')||'<tr><td>'+(lGo?'조건에 맞는 제품이 없습니다':'검색 조건을 입력하고 [조회]를 눌러주세요')}</table></div></div>`;
 if(sel){const p=db.products.find(x=>x.code==sel&&x.store==cur.store);if(p){const c=calc(p);
  const k=sv.code==p.code?sv:{pt:'base',sn:1,sa:Math.round(c.base)};const mg=v=>v?`${fmt(v-c.cost)}원 (${((v-c.cost)/v*100).toFixed(1)}%)`:'공시가 입력 필요';
  h+=`<div class=card><h3>${p.model} ${phIcon(p.code,p.store)} <span class=tag>${p.code}</span> <small style="font-weight:400;color:var(--mu)">${(()=>{const r=rateNow();return p.mat=='PT'?'백금 시세 '+fmt(r.pt):p.mat=='Ag'?'은 시세 '+fmt(r.ag):'금 시세 '+fmt(r.au)})()}원/돈</small> ${p.qty>0?'':'<span class=tag style="color:var(--wn);border-color:var(--wn)">품절</span>'}</h3>
  ${c.pol=='P'?`<div class=row style="margin:0 0 6px"><div><label>공시 정상가(원) 입력<input id=pub type=number min=0 value=${PUB[cur.store+p.code]||''} onkeydown="if(event.key=='Enter')setPub('${p.code}')"></label></div><button class=p onclick="setPub('${p.code}')">적용</button></div>`:''}<div class=price><div><small>정상가</small><b>${fmt(c.base)}</b></div><div><small>할인가 (${c.pol=='P'?'-'+c.dp+'%':'÷'+(1+c.dp/100)})</small><b>${fmt(c.disc)}</b></div><div><small>카드가 (+${c.cp}%)</small><b>${fmt(c.card)}</b></div></div>
  <div class=kv><div><span>분류</span>${cn(p.cat)}</div><div><span>재질/순도</span>${p.mat} / ${p.purity}</div><div><span>가격정책</span>${PN[c.pol]}</div><div><span>VAT</span>${p.vat==0?'미포함(+10%)':'포함'}</div><div><span>색상</span>${p.color}</div><div><span>사이즈</span>${p.size}</div>
  <div><span>총중량</span>${ds(p.total)}</div><div><span>순중량(24K)</span>${ds(p.w24)}</div><div><span>18K중량</span>${ds(p.w18)}</div><div><span>14K중량</span>${ds(p.w14)}</div>
  <div><span>순금환산</span>${ds(c.conv)}</div><div><span>알중량</span>${g3(c.stone)}g</div>${c.pol=='S'?`<div><span>${p.mat=='PT'?'백금값':p.mat=='Ag'?'은값':'금값'}</span>${fmt(c.gold)}원</div>`:''}${c.pol=='S'?`<div><span>세공비</span>${fmt(c.tag)}원</div>`:c.pol=='U'?`<div><span>판매 배수</span>${p.mult}배</div>`:`<div><span>공시 정상가(입력값)</span>${fmt(c.base)}원</div>`}<div><span>재고수량</span>${p.qty}</div>
